<!DOCTYPE html>
<html lang="ru">
@@include('html/parts/head.html', {"title":"Главная"})
<body>
    <div class="wrapper">

@@include('html/parts/aside.html')

        <div class="contant" data-page-contant>

@@include('html/parts/header.html')

            <main class="main struct-unit">
                <div class="main__work struct-unit__work">
                    <h1 class="struct-unit__title h1">Магазины</h1>
                    <div class="struct-unit__filter filter-struct-unit">
                        <form action="" class="filter-struct-unit__form">
                            <div class="filter-struct-unit__radio input-block">
                                <span class="input-block__title">Сортировка:</span>
                                <div class="filter-struct-unit__wrap">
                                    <div class="input-block__wrap">
                                        <input class="input-block__input-radio" type="radio" id="filter-struct-unit--retail" name="filter" value="retail" checked>
                                        <label class="input-block__label" for="filter-struct-unit--retail">Номер магазина</label>
                                    </div>
                                    <div class="input-block__wrap">
                                        <input class="input-block__input-radio" type="radio" id="filter-struct-unit--address" name="filter" value="address">
                                        <label class="input-block__label" for="filter-struct-unit--address">Адрес</label>
                                    </div>
                                </div>
                            </div>

                            <div class="filter-struct-unit__drop input-block">
                                <span class="input-block__title">Регион:</span>
                                <div class="filter-struct-unit__wrap">
                                    <div class="input-block__wrap">
                                        <input class="input-block__input-checkbox" type="checkbox" id="filter-struct-unit--rostov" name="filter" value="rostov">
                                        <label class="input-block__label" for="filter-struct-unit--rostov">Ростов</label>
                                    </div>
                                    <div class="input-block__wrap">
                                        <input class="input-block__input-checkbox" type="checkbox" id="filter-struct-unit--south" name="filter" value="south">
                                        <label class="input-block__label" for="filter-struct-unit--south">Юг</label>
                                    </div>
                                </div>
                            </div>

                            <div class="filter-struct-unit__order input-block">
                                <span class="input-block__title">Порядок:</span>
                                <div class="input-block__wrap">
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="struct-unit__table table-struct-unit">
                        <table class="table-struct-unit__table table">
                            <tr class="table-struct-unit__tr">
                                <th class="table-struct-unit__th table__th">№ <br> п/п</th>
                                <th class="table-struct-unit__th table__th">№ <br> магазина</th>
                                <th class="table-struct-unit__th table__th">Адрес</th>
                                <th class="table-struct-unit__th table__th">Телефон</th>
                                <th class="table-struct-unit__th table__th">Адрес сети</th>
                            </tr>
                            <tr class="table-struct-unit__tr table__tr">
                                <td class="table-struct-unit__td table__td">999</td>
                                <td class="table-struct-unit__td table__td">48</td>
                                <td class="table-struct-unit__td table__td">
                                    <button class="table-struct-unit__button btn-reset">
                                        Кисловодск, ул. Маяковского/пр-кт Победы, д. 16/98
                                    </button>
                                </td>
                                <td class="table-struct-unit__td table__td">
                                    <a href="tel:+79383500106" class="table-struct-unit__link">+7(938)350-01-06</a>
                                </td>
                                <td class="table-struct-unit__td table__td">172.16.7.160/28</td>
                            </tr>
                        </table>
                    </div>
                </div>
                <div class="main__detail struct-unit__detail">
                    detail
                </div>
            </main>

@@include('html/parts/footer.html')

        </div>

<!-- @@include('html/parts/popup.html') -->

    </div>
</body>
</html>
